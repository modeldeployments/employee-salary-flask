<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ML API</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="login">

        <h1>Predict Salary Analysis</h1>

        <!-- Input form for salary prediction -->
        <form action="{{ url_for('predict') }}" method="post">

            <input
                type="text"
                name="experience"
                placeholder="Experience"
                required
            >

            <input
                type="text"
                name="test_score"
                placeholder="Test Score"
                required
            >

            <input
                type="text"
                name="interview_score"
                placeholder="Interview Score"
                required
            >

            <button
                type="submit"
                class="btn btn-primary btn-block btn-large">
                Predict
            </button>

        </form>

        <br>
        <br>

        {{ prediction_text }}

    </div>

</body>

</html>
